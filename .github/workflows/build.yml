name: Build PSP homebrew
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install asset-conversion dependency
        run: apk add --no-cache python3
      - name: Convert downloaded OBJ models to PSP GU meshes
        run: python3 tools/obj2c.py
      - name: Build EBOOT.PBP
        run: |
          make clean
          make
      - name: Upload PSP executable
        uses: actions/upload-artifact@v4
        with:
          name: PSP-3D-Target-Shooter-EBOOT
          path: EBOOT.PBP
          if-no-files-found: error
